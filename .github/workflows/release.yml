name: Build & Publish Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract App Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1 | tr -d '\r')
          BUILD_NUM=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted App Version: $VERSION (Build: $BUILD_NUM)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Android Release APK (Optimized Split-Per-ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Prepare Release Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APK_DIR="app/build/app/outputs/flutter-apk"
          # Modern phones (99% of Android) use arm64-v8a: set as primary app-release.apk
          cp "$APK_DIR/app-arm64-v8a-release.apk" "$APK_DIR/app-release.apk"
          cp "$APK_DIR/app-arm64-v8a-release.apk" "$APK_DIR/Jronix-Pro-VPN-v${VERSION}-arm64.apk"
          cp "$APK_DIR/app-armeabi-v7a-release.apk" "$APK_DIR/Jronix-Pro-VPN-v${VERSION}-arm32.apk"
          echo "Optimized Artifacts ready:"
          ls -lh "$APK_DIR"/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: "Jronix Pro VPN ${{ steps.get_version.outputs.TAG_NAME }}"
          body: |
            ### 🛡️ Jronix Pro VPN Release ${{ steps.get_version.outputs.TAG_NAME }}
            
            **What's inside:**
            - Next-Gen WireGuard® Tunneling Protocol
            - ChaCha20-Poly1305 / AES-256 Military Encryption
            - Dynamic Virtual IP Masking & Private 1.1.1.1 DNS Shield
            - Strict RAM-Only Zero-Logs Policy
            
            **Download APK (Optimized for your phone):**
            - **`app-release.apk`** (or `arm64.apk`): Recommended for all modern phones (~28 MB).
            - **`arm32.apk`**: For older 32-bit Android phones (~25 MB).
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/Jronix-Pro-VPN-v${{ steps.get_version.outputs.VERSION }}-arm64.apk
            app/build/app/outputs/flutter-apk/Jronix-Pro-VPN-v${{ steps.get_version.outputs.VERSION }}-arm32.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
